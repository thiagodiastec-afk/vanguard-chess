name: Quality gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build production assets and server
        run: npm run build

      - name: Smoke test production server security
        run: npm run test:server

      - name: Run engine and backend validation
        run: npm run test:full

      - name: Run Firestore rules and migration tests
        run: npm run test:rules

      - name: Run project smoke test
        run: npm run test:smoke

      - name: Audit dependencies
        run: npm audit --audit-level=low
