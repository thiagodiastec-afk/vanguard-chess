<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Vanguard Chess</title>
    <meta name="description" content="Plataforma de jogos de xadrez em tempo real com sistema de ranking Elo." />
    <meta property="og:title" content="Vanguard Chess" />
    <meta property="og:description" content="Plataforma de jogos de xadrez em tempo real com sistema de ranking Elo." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  
    <style>
      body {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      input, textarea {
        -webkit-user-select: auto !important;
        -khtml-user-select: auto !important;
        -moz-user-select: auto !important;
        -ms-user-select: auto !important;
        user-select: auto !important;
      }
    </style>
    <script>
      // Desativar clique direito
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Desativar atalhos de desenvolvedor
      document.addEventListener('keydown', function (event) {
        // Prevenir F12
        if (event.keyCode === 123) {
          event.preventDefault();
        }
        // Prevenir Ctrl+Shift+I (Inspecionar)
        if (event.ctrlKey && event.shiftKey && event.keyCode === 73) {
          event.preventDefault();
        }
        // Prevenir Ctrl+Shift+J (Console)
        if (event.ctrlKey && event.shiftKey && event.keyCode === 74) {
          event.preventDefault();
        }
        // Prevenir Ctrl+Shift+C (Inspecionar Elemento)
        if (event.ctrlKey && event.shiftKey && event.keyCode === 67) {
          event.preventDefault();
        }
        // Prevenir Ctrl+U (Ver código-fonte)
        if (event.ctrlKey && event.keyCode === 85) {
          event.preventDefault();
        }
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
