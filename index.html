    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Vanguard Chess",
        "url": "https://vanguardchess.com.br/",
        "description": "Xadrez online com partidas contra jogadores, treinamento com inteligência artificial, ranking Elo e aulas de xadrez.",
        "inLanguage": "pt-BR"
      }
    </script>
  
    <style>
      body {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      input, textarea {
        -webkit-user-select: auto !important;
        -khtml-user-select: auto !important;
        -moz-user-select: auto !important;
        -ms-user-select: auto !important;
        user-select: auto !important;
      }
    </style>
    <script>
      // Desativar clique direito
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Desativar atalhos de desenvolvedor
      document.addEventListener('keydown', function (event) {
        // Prevenir F12
        if (event.keyCode === 123) {
          event.preventDefault();
        }
        // Prevenir Ctrl+Shift+I (Inspecionar)
        if (event.ctrlKey && event.shiftKey && event.keyCode === 73) {
          event.preventDefault();
        }
        // Prevenir Ctrl+Shift+J (Console)
        if (event.ctrlKey && event.shiftKey && event.keyCode === 74) {
          event.preventDefault();
        }
        // Prevenir Ctrl+Shift+C (Inspecionar Elemento)
        if (event.ctrlKey && event.shiftKey && event.keyCode === 67) {
          event.preventDefault();
        }
        // Prevenir Ctrl+U (Ver código-fonte)
        if (event.ctrlKey && event.keyCode === 85) {
          event.preventDefault();
        }
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
